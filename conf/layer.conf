# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "nedap-linux-mixin"
BBFILE_PATTERN_nedap-linux-mixin = "^${LAYERDIR}/"
BBFILE_PRIORITY_nedap-linux-mixin = "5"

LAYERDEPENDS_nedap-linux-mixin = "core"
LAYERSERIES_COMPAT_nedap-linux-mixin = "wrynose"
